<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freebuff2OpenCode&thinsp;Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #0d6efd;
      --secondary-color: #6c757d;
      --success-color: #32CD32;
      --bs-success: #32CD32;
      --bs-success-rgb: 50, 205, 50;
      --danger-color: #dc3545;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 0;
      background-color: #0d1117;
    }
    .dashboard-container {
      position: relative;
      z-index: 10;
      max-width: 1200px;
      margin: 0 auto;
      overflow-x: hidden;
    }
    .card {
      position: relative;
      border: none;
      border-radius: var(--glass-radius, 12px);
      margin-bottom: 20px;
      background: transparent !important;
    }
    .glass-panel {
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      overflow: hidden;
    }
    .glass-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: inherit;
      background-color: rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }
    .glass-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      pointer-events: none;
    }
    .card-content {
      position: relative;
      z-index: 3;
      border-radius: inherit;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.1);
    }
    .card-header {
      background: rgba(0, 0, 0, 0.2) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 14px;
      color: white;
      padding: 0.4rem 1.25rem;
      position: relative;
      z-index: 4;
    }
    .card-body {
      padding: 0.5rem;
      position: relative;
      z-index: 4;
      backdrop-filter: blur(13px) !important;
      -webkit-backdrop-filter: blur(13px) !important;
    }
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }
    .status-online { background-color: var(--success-color); box-shadow: 0 0 10px var(--success-color); }
    .status-offline { background-color: var(--danger-color); box-shadow: 0 0 10px var(--danger-color); }
    .status-unknown { background-color: var(--secondary-color); }
    .token-blurred {
      filter: blur(5px);
      transition: filter 0.2s ease;
    }
    .token-blurred:hover {
      filter: blur(0) !important;
    }
    .btn-white-bg {
      background: white;
      border: 1px solid white;
      color: #0d1117;
    }
    .btn-white-bg:hover {
      background: rgba(255, 255, 255, 0.85);
      border-color: white;
      color: #0d1117;
    }
    .btn-outline-action {
      border: 1px solid rgba(255, 255, 255, 0.8);
      color: white;
      background: transparent;
    }
    .btn-outline-action:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: white;
      color: white;
    }
    .stats-card {
      background: transparent;
      border-radius: 12px;
      padding: 0;
      text-align: center;
      position: relative;
      z-index: 10;
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
    }
    .stats-value {
      font-size: 28px;
      font-weight: 700;
      color: white;
    }
    .stats-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1050;
    }
    .form-label {
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 6px;
    }
    .form-control, .form-select {
      display: block;
      width: 100%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 0.375rem 0.75rem;
      font-size: 1rem;
      border-radius: 0.375rem;
    }
    .form-control:focus, .form-select:focus {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      color: white;
      outline: 0;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
    .text-muted {
      color: rgba(255, 255, 255, 0.7) !important;
    }
    h4, h5, strong, .fw-medium {
      color: white !important;
    }
    small {
      color: rgba(255, 255, 255, 0.8) !important;
    }
    .collapsible-header {
      cursor: pointer;
      user-select: none;
    }
    .collapsible-header .toggle-icon {
      transition: transform 0.2s ease;
    }
    .collapsible-header .toggle-icon.collapsed {
      transform: rotate(-90deg);
    }
    .collapse-section {
      transition: all 0.3s ease;
    }
    .collapse-section.collapsed {
      display: none;
    }
    .pool-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .pool-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .pool-name {
      font-weight: 600;
      color: #58a6ff;
      font-size: 0.95rem;
    }
    .pool-status {
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .model-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.03);
      opacity: 0.5;
      user-select: none;
      transition: all 0.2s ease;
      margin: 3px;
    }
    .model-tag.enabled {
      border-color: rgba(50, 205, 50, 0.3);
      background: rgba(50, 205, 50, 0.1);
      opacity: 1;
    }
    .model-tag:hover { opacity: 0.8; }
    .model-tag.enabled:hover { opacity: 1; }
    .model-tag-name {
      font-size: 11px;
      font-weight: 600;
      color: white;
      white-space: nowrap;
    }
    .model-tag-id {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.5);
      white-space: nowrap;
    }
    .model-tag input[type="checkbox"] {
      pointer-events: none;
    }
    .ad-card {
      padding: 0 .5rem;
      position: relative;
      cursor: default;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    .ad-glass-box {
      display: flex;
      align-items: stretch;
      gap: 0;
      flex: 1;
      min-height: 0;
      width: 100%;
    }
    .ad-glass-inner {
      flex: 1;
      min-width: 0;
      min-height: 0;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 10px 12px;
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
    }
    .ad-arrow {
      flex-shrink: 0;
      width: 32px;
      border-radius: 12px;
      background: rgba(255,255,255,0.15);
      border: none;
      color: rgba(0,0,0,0.35);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease, background 0.15s ease;
      padding: 0;
      line-height: 1;
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
    }
    .ad-arrow:hover {
      color: rgba(0,0,0,0.7);
    }
    .ad-arrow-left { margin-right: 4px; }
    .ad-arrow-right { margin-left: 4px; }
    #adSlidesContainer {
      display: grid;
    }
    #adSlidesContainer > * {
      grid-row: 1;
      grid-column: 1;
    }
    .ad-slide {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }
    .ad-slide.active {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
    }
    .ad-dot {
      cursor: pointer;
      padding: 4px;
    }
    .ad-dot .dot-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(0,0,0,0.2);
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .ad-dot.active .dot-indicator {
      background: rgba(0,0,0,0.7);
      transform: scale(1.3);
    }
    .ad-header-bar {
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
    }
    .ad-header-bar .ad-label {
      font-size: 9px;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <svg style="position:absolute;overflow:hidden;width:0;height:0" color-interpolation-filters="sRGB">
    <defs id="glass-defs"></defs>
  </svg>

  <div class="container pt-2">
  <div class="row justify-content-center">
  <div class="dashboard-container col-11">
    <div class="card sticky-top p-0" style="top:0;z-index:100" data-glass>
      <div class="glass-panel"></div>
      <div class="card-content px-2">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h4 class="mb-0"><i class="bi bi-lightning-charge-fill me-2"></i>Freebuff2OpenCode Dashboard</h4>
          </div>
          <div class="text-end">
            <div>
              <span id="statusIndicator" class="status-indicator status-unknown"></span>
              <span id="statusText" class="fw-medium">Checking...</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row text-center d-flex align-items-stretch mb-3">
      <div class="col-12 col-md-8">
        <div class="card h-100 d-flex flex-column" data-glass>
          <div class="glass-panel"></div>
          <div class="ad-card card-content flex-grow-1 d-flex flex-column">
            <div class="ad-header-bar">
              <span class="ad-label" id="adCounterLabel">Ad</span>
            </div>
            <div class="ad-glass-box">
              <button class="ad-arrow ad-arrow-left" onclick="prevAd()" title="Previous ad"><i class="bi bi-chevron-left"></i></button>
              <div class="ad-glass-inner">
                <div id="adSlidesContainer"></div>
              </div>
              <button class="ad-arrow ad-arrow-right" onclick="nextAd()" title="Next ad"><i class="bi bi-chevron-right"></i></button>
            </div>
            <div id="adDots" style="display:flex;justify-content:center;gap:4px;margin-top:6px"></div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-2"><div class="stats-card card h-100 d-flex flex-column" data-glass><div class="card-content flex-grow-1 justify-content-center align-items-center d-flex flex-column" style="padding:10px"><div class="stats-value" id="totalModels">0</div><div class="stats-label">Models</div></div></div></div>
      <div class="col-6 col-md-2"><div class="stats-card card h-100 d-flex flex-column" data-glass><div class="card-content flex-grow-1 justify-content-center align-items-center d-flex flex-column" style="padding:10px"><div class="stats-value" id="countryCode">-</div><div class="stats-label">Country</div></div></div></div>
    </div>

    <div class="row">
      <div class="col-lg-8">
        <div class="card" data-glass data-section="tokens">
          <div class="glass-panel"></div>
          <div class="card-content">
            <div class="card-header collapsible-header d-flex justify-content-between align-items-center" onclick="toggleSection('tokens')">
              <span>
                <i class="bi bi-chevron-down toggle-icon me-1"></i>
                <i class="bi bi-key-fill me-2"></i>Auth Token Status
              </span>
              <span id="tokenRemainingTime" style="font-size:0.85rem;font-weight:600;color:#58a6ff"></span>
              <span class="badge bg-secondary" id="tokenCountBadge">0</span>
            </div>
            <div class="card-body collapse-section" id="section-tokens">
              <div id="tokenPoolsContainer"></div>
              <small class="text-muted" style="display:block;margin-top:10px;">
                Tokens are auto-detected from Freebuff CLI (~/.config/manicode/credentials.json)
              </small>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div id="oauthContainer" style="display:none"></div>
        <div class="card" data-glass data-section="models">
          <div class="glass-panel"></div>
          <div class="card-content">
            <div class="card-header collapsible-header d-flex justify-content-between align-items-center" onclick="toggleSection('models')">
              <span>
                <i class="bi bi-chevron-down toggle-icon me-1"></i>
                <i class="bi bi-cpu-fill me-2"></i>Available Models
              </span>
              <span class="badge bg-secondary" id="modelCountBadge">0</span>
            </div>
            <div class="card-body collapse-section" id="section-models">
              <div id="modelsContainer"></div>
            </div>
          </div>
        </div>

        <div class="card" data-glass data-section="actions">
          <div class="glass-panel"></div>
          <div class="card-content">
            <div class="card-header collapsible-header" onclick="toggleSection('actions')">
              <i class="bi bi-chevron-down toggle-icon collapsed me-1"></i>
              <i class="bi bi-lightning-charge-fill me-2"></i>Quick Actions
            </div>
            <div class="card-body collapse-section collapsed" id="section-actions">
              <div class="d-grid gap-2">
                <button class="btn btn-outline-action" onclick="checkHealth()"><i class="bi bi-activity me-2"></i>Check Health</button>
                <button class="btn btn-outline-action" onclick="testConnection()"><i class="bi bi-wifi me-2"></i>Test Connection</button>
                <button class="btn btn-outline-action" onclick="refreshModels()"><i class="bi bi-arrow-clockwise me-2"></i>Refresh Models</button>
              </div>
            </div>
          </div>
        </div>

        <div class="card" data-glass data-section="env">
          <div class="glass-panel"></div>
          <div class="card-content">
            <div class="card-header collapsible-header" onclick="toggleSection('env')">
              <i class="bi bi-chevron-down toggle-icon collapsed me-1"></i>
              <i class="bi bi-info-circle-fill me-2"></i>Environment
            </div>
            <div class="card-body collapse-section collapsed" id="section-env">
              <div class="mb-2">
                <small class="text-muted">Runtime</small>
                <div class="fw-medium" id="runtimeInfo">-</div>
              </div>
              <div class="mb-2">
                <small class="text-muted">Warp Plus</small>
                <div class="fw-medium" id="operaProxyStatus">-</div>
              </div>
              <div class="mb-2">
                <small class="text-muted">Started At</small>
                <div class="fw-medium" id="startedAt">-</div>
              </div>

              <div class="mb-2">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="wallpaperToggle" onchange="toggleWallpaper()">
                  <label class="form-check-label text-muted" for="wallpaperToggle" style="cursor:pointer">Enable Wallpaper</label>
                </div>
              </div>
              <div class="mb-2">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="adsToggleEnv" checked onchange="toggleAds(this.checked)">
                  <label class="form-check-label text-muted" for="adsToggleEnv" style="cursor:pointer">Show Ads</label>
                </div>
              </div>
              <div class="mb-2">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="blurTokensEnv" onchange="toggleBlurTokens(this.checked)">
                  <label class="form-check-label text-muted" for="blurTokensEnv" style="cursor:pointer">SS Mode</label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="card" data-glass data-section="config">
          <div class="glass-panel"></div>
          <div class="card-content">
            <div class="card-header collapsible-header" onclick="toggleSection('config')">
              <i class="bi bi-chevron-down toggle-icon collapsed me-1"></i>
              <i class="bi bi-gear-fill me-2"></i>Proxy Configuration
            </div>
            <div class="card-body collapse-section collapsed" id="section-config">
              <form id="configForm">
                <div class="row">
                  <div class="col-6 mb-2">
                    <label class="form-label" style="font-size:10px;margin-bottom:2px">Listen Address</label>
                    <input type="text" class="form-control form-control-sm" id="listenAddr" value=":8080" onchange="saveConfigValue('listenAddr', 'listenAddr')">
                  </div>
                  <div class="col-6 mb-2">
                    <label class="form-label" style="font-size:10px;margin-bottom:2px">Rotation</label>
                    <input type="text" class="form-control form-control-sm" id="rotationInterval" value="6h" onchange="saveConfigValue('rotationInterval', 'rotationInterval')">
                  </div>
                </div>
                <div class="row">
                  <div class="col-8 mb-2">
                    <label class="form-label" style="font-size:10px;margin-bottom:2px">Upstream URL</label>
                    <input type="url" class="form-control form-control-sm" id="upstreamUrl" value="https://www.codebuff.com" onchange="saveConfigValue('upstreamUrl', 'upstreamBaseURL')">
                  </div>
                  <div class="col-4 mb-2">
                    <label class="form-label" style="font-size:10px;margin-bottom:2px">Timeout</label>
                    <input type="text" class="form-control form-control-sm" id="requestTimeout" value="15m" onchange="saveConfigValue('requestTimeout', 'requestTimeout')">
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const SURFACE_FNS = {
      convex_squircle: (x) => Math.pow(1 - Math.pow(1 - x, 4), 0.25),
    };

    function calculateRefractionProfile(glassThickness, bezelWidth, heightFn, ior, samples) {
      samples = samples || 128;
      const eta = 1 / ior;
      function refract(nx, ny) {
        const dot = ny;
        const k = 1 - eta * eta * (1 - dot * dot);
        if (k < 0) return null;
        const sq = Math.sqrt(k);
        return [-(eta * dot + sq) * nx, eta - (eta * dot + sq) * ny];
      }
      const profile = new Float64Array(samples);
      for (let i = 0; i < samples; i++) {
        const x = i / samples;
        const y = heightFn(x);
        const dx = x < 1 ? 0.0001 : -0.0001;
        const y2 = heightFn(x + dx);
        const deriv = (y2 - y) / dx;
        const mag = Math.sqrt(deriv * deriv + 1);
        const ref = refract(-deriv / mag, -1 / mag);
        if (!ref) { profile[i] = 0; continue; }
        profile[i] = ref[0] * ((y * bezelWidth + glassThickness) / ref[1]);
      }
      return profile;
    }

    function generateDisplacementMap(w, h, radius, bezelWidth, profile, maxDisp) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(w, h);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) { d[i] = 128; d[i+1] = 128; d[i+2] = 0; d[i+3] = 255; }
      const r = radius, rSq = r*r, r1Sq = (r+1)**2;
      const rBSq = Math.max(r - bezelWidth, 0)**2;
      const wB = w - r*2, hB = h - r*2, S = profile.length;
      for (let y1 = 0; y1 < h; y1++) {
        for (let x1 = 0; x1 < w; x1++) {
          const x = x1 < r ? x1 - r : x1 >= w - r ? x1 - r - wB : 0;
          const y = y1 < r ? y1 - r : y1 >= h - r ? y1 - r - hB : 0;
          const dSq = x*x + y*y;
          if (dSq > r1Sq || dSq < rBSq) continue;
          const dist = Math.sqrt(dSq);
          const fromSide = r - dist;
          const op = dSq < rSq ? 1 : 1 - (dist - Math.sqrt(rSq)) / (Math.sqrt(r1Sq) - Math.sqrt(rSq));
          if (op <= 0 || dist === 0) continue;
          const cos = x / dist, sin = y / dist;
          const bi = Math.min(((fromSide / bezelWidth) * S) | 0, S - 1);
          const disp = profile[bi] || 0;
          const dX = (-cos * disp) / maxDisp, dY = (-sin * disp) / maxDisp;
          const idx = (y1 * w + x1) * 4;
          d[idx] = (128 + dX * 127 * op + 0.5) | 0;
          d[idx+1] = (128 + dY * 127 * op + 0.5) | 0;
        }
      }
      ctx.putImageData(img, 0, 0);
      return c.toDataURL();
    }

    function generateSpecularMap(w, h, radius, bezelWidth, angle) {
      angle = angle != null ? angle : Math.PI / 3;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(w, h);
      const d = img.data; d.fill(0);
      const r = radius, rSq = r*r, r1Sq = (r+1)**2;
      const rBSq = Math.max(r - bezelWidth, 0)**2;
      const wB = w - r*2, hB = h - r*2;
      const sv = [Math.cos(angle), Math.sin(angle)];
      for (let y1 = 0; y1 < h; y1++) {
        for (let x1 = 0; x1 < w; x1++) {
          const x = x1 < r ? x1 - r : x1 >= w - r ? x1 - r - wB : 0;
          const y = y1 < r ? y1 - r : y1 >= h - r ? y1 - r - hB : 0;
          const dSq = x*x + y*y;
          if (dSq > r1Sq || dSq < rBSq) continue;
          const dist = Math.sqrt(dSq);
          const fromSide = r - dist;
          const op = dSq < rSq ? 1 : 1 - (dist - Math.sqrt(rSq)) / (Math.sqrt(r1Sq) - Math.sqrt(rSq));
          if (op <= 0 || dist === 0) continue;
          const cos = x / dist, sin = -y / dist;
          const dot = Math.abs(cos * sv[0] + sin * sv[1]);
          const edge = Math.sqrt(Math.max(0, 1 - (1 - fromSide)**2));
          const coeff = dot * edge;
          const col = (255 * coeff) | 0;
          const alpha = (col * coeff * op) | 0;
          const idx = (y1 * w + x1) * 4;
          d[idx] = col; d[idx+1] = col; d[idx+2] = col; d[idx+3] = alpha;
        }
      }
      ctx.putImageData(img, 0, 0);
      return c.toDataURL();
    }

    function initLiquidGlass() {
      const cards = document.querySelectorAll('[data-glass]');
      const defs = document.getElementById('glass-defs');
      let filterIndex = 0;
      cards.forEach(card => {
        if (!card.querySelector('.glass-panel')) return;
        requestAnimationFrame(() => {
          const rect = card.getBoundingClientRect();
          if (rect.width < 2 || rect.height < 2) return;
          const w = Math.round(rect.width);
          const h = Math.round(rect.height);
          const radius = 12, bezelW = 30, glassThick = 60, ior = 2.5;
          const blurAmt = 0.3, specOpacity = 0.5, specSat = 4;
          const heightFn = SURFACE_FNS.convex_squircle;
          const profile = calculateRefractionProfile(glassThick, bezelW, heightFn, ior, 128);
          const maxDisp = Math.max(...Array.from(profile).map(Math.abs)) || 1;
          const dispUrl = generateDisplacementMap(w, h, radius, bezelW, profile, maxDisp);
          const specUrl = generateSpecularMap(w, h, radius, bezelW * 2.5);
          const scale = maxDisp * 1.0;
          const filterId = 'liquid-glass-' + filterIndex++;
          const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
          filter.setAttribute('id', filterId);
          filter.setAttribute('x', '0%');
          filter.setAttribute('y', '0%');
          filter.setAttribute('width', '100%');
          filter.setAttribute('height', '100%');
          filter.innerHTML = `
            <feGaussianBlur in="SourceGraphic" stdDeviation="${blurAmt}" result="blurred_source" />
            <feImage href="${dispUrl}" x="0" y="0" width="${w}" height="${h}" result="disp_map" />
            <feDisplacementMap in="blurred_source" in2="disp_map" scale="${scale}" xChannelSelector="R" yChannelSelector="G" result="displaced" />
            <feColorMatrix in="displaced" type="saturate" values="${specSat}" result="displaced_sat" />
            <feImage href="${specUrl}" x="0" y="0" width="${w}" height="${h}" result="spec_layer" />
            <feComposite in="displaced_sat" in2="spec_layer" operator="in" result="spec_masked" />
            <feComponentTransfer in="spec_layer" result="spec_faded"><feFuncA type="linear" slope="${specOpacity}" /></feComponentTransfer>
            <feBlend in="spec_masked" in2="displaced" mode="normal" result="with_sat" />
            <feBlend in="spec_faded" in2="with_sat" mode="normal" />
          `;
          defs.appendChild(filter);
          const panel = card.querySelector('.glass-panel');
          if (!panel) return;
          panel.style.backdropFilter = `url(#${filterId})`;
          panel.style.webkitBackdropFilter = `url(#${filterId})`;
        });
      });
    }

    async function fetchAds() {
      if (!adsEnabled) return;
      try {
        const resp = await fetch('/api/ads');
        if (!resp.ok) return;
        const data = await resp.json();
        let ads = [];
        if (Array.isArray(data)) ads = data;
        else if (data && data.ads && Array.isArray(data.ads)) ads = data.ads;
        if (ads.length > 0) {
          adsList = ads.map(ad => ({
            adHtml: ad.html || ad.body || '',
            adTitle: ad.title || ad.name || '',
            adLink: ad.clickUrl || ad.ctaUrl || ad.link || ad.url || '#',
            adImage: ad.favicon || ad.image || ad.thumbnail || ad.logo || '',
            adSponsor: ad.sponsor || ad.advertiser || ad.company || '',
            adCallToAction: ad.cta || ad.callToAction || '',
            adDescription: ad.adText || ad.description || '',
            adImpUrl: ad.impUrl || ad.impressionUrl || ad.pixelUrl || ''
          }));
          currentAdIdx = 0;
          adImpressionSent.clear();
          try { localStorage.setItem('_cachedAds', JSON.stringify(adsList)); } catch (e) {}
        } else if (adsList.length === 0) {
          try { const cached = localStorage.getItem('_cachedAds'); if (cached) adsList = JSON.parse(cached); } catch (e) {}
        }
      } catch (e) {
        if (adsList.length === 0) {
          try { const cached = localStorage.getItem('_cachedAds'); if (cached) adsList = JSON.parse(cached); } catch (e2) {}
        }
      }
    }

    function rotateAd() {
      if (!adsEnabled || adsList.length === 0) return;
      currentAdIdx = (currentAdIdx + 1) % adsList.length;
      goToAdSlide(currentAdIdx);
    }

    function prevAd() {
      if (!adsEnabled || adsList.length === 0) return;
      currentAdIdx = (currentAdIdx - 1 + adsList.length) % adsList.length;
      goToAdSlide(currentAdIdx);
    }

    function nextAd() {
      if (!adsEnabled || adsList.length === 0) return;
      currentAdIdx = (currentAdIdx + 1) % adsList.length;
      goToAdSlide(currentAdIdx);
    }

    function goToAdSlide(idx) {
      const slides = document.querySelectorAll('.ad-slide');
      const dots = document.querySelectorAll('.ad-dot');
      slides.forEach((s, i) => s.classList.toggle('active', i === idx));
      dots.forEach((d, i) => d.classList.toggle('active', i === idx));
      currentAdIdx = idx;
      const counterLabel = document.getElementById('adCounterLabel');
      if (counterLabel && adsList.length > 0) {
        counterLabel.textContent = 'Ad ' + (idx + 1) + '/' + adsList.length;
      }
      const ad = adsList[idx];
      if (ad && ad.adImpUrl && !adImpressionSent.has(idx)) {
        adImpressionSent.add(idx);
        fetch('/api/ads/impression', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ impUrl: ad.adImpUrl, mode: 'LITE' }) }).catch(() => {});
      }
    }

    function renderAdInTokenCard() {
      const slidesContainer = document.getElementById('adSlidesContainer');
      const dotsContainer = document.getElementById('adDots');
      const counterLabel = document.getElementById('adCounterLabel');
      const arrows = document.querySelectorAll('.ad-arrow');
      if (!slidesContainer || !dotsContainer) return;
      if (!adsEnabled) {
        slidesContainer.innerHTML = '<div style="font-size:12px;color:rgba(13,17,23,0.4);text-align:center;padding:12px 0">Ads disabled</div>';
        dotsContainer.innerHTML = '';
        if (counterLabel) counterLabel.textContent = 'Ads off';
        arrows.forEach(a => a.style.display = 'none');
        return;
      }
      arrows.forEach(a => a.style.display = adsList.length > 1 ? '' : 'none');
      if (adsList.length === 0) {
        slidesContainer.innerHTML = '<div style="font-size:12px;color:rgba(13,17,23,0.4);text-align:center;padding:12px 0">No ads available</div>';
        dotsContainer.innerHTML = '';
        if (counterLabel) counterLabel.textContent = 'Ad';
        return;
      }
      if (currentAdIdx >= adsList.length) currentAdIdx = 0;
      slidesContainer.innerHTML = adsList.map((ad, i) => {
        let inner = '';
        if (ad.adHtml) {
          inner = ad.adHtml;
        } else if (ad.adImage || ad.adTitle) {
          inner = `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            ${ad.adImage ? `<img src="${escapeHtml(ad.adImage)}" alt="${escapeHtml(ad.adTitle)}" style="width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;border:1px solid rgba(255,255,255,0.15)">` : ''}
            <div style="flex:1;min-width:0">
              ${ad.adSponsor ? `<div style="font-size:9px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.4);margin-bottom:1px;text-align:left">${escapeHtml(ad.adSponsor)}</div>` : ''}
              ${ad.adTitle ? `<div style="font-weight:600;font-size:12px;color:#0d1117;margin-bottom:1px;text-align:left">${escapeHtml(ad.adTitle)}</div>` : ''}
              ${ad.adDescription ? `<div style="font-size:10px;color:rgba(13,17,23,0.5);line-height:1.3;text-align:left">${escapeHtml(ad.adDescription)}</div>` : ''}
            </div>
            ${ad.adCallToAction ? `<a href="${escapeHtml(ad.adLink)}" target="_blank" rel="noopener sponsored" style="background:rgba(13,17,23,0.1);border:1px solid rgba(13,17,23,0.2);color:#0d1117;padding:3px 10px;border-radius:5px;font-size:10px;font-weight:600;white-space:nowrap;flex-shrink:0;text-decoration:none">${escapeHtml(ad.adCallToAction)}</a>` : ''}
          </div>`;
        }
        if (!inner) inner = '<div style="font-size:12px;color:rgba(13,17,23,0.4)">No ad content</div>';
        return `<div class="ad-slide${i === currentAdIdx ? ' active' : ''}" style="padding:4px 0">${inner}</div>`;
      }).join('');
      dotsContainer.innerHTML = adsList.map((_, i) => `<span class="ad-dot${i === currentAdIdx ? ' active' : ''}" onclick="goToAdSlide(${i})"><span class="dot-indicator"></span></span>`).join('');
      if (counterLabel) counterLabel.textContent = adsList.length > 1 ? 'Ad ' + (currentAdIdx + 1) + '/' + adsList.length : 'Ad';
    }

        const configResponse = await fetch('/api/config');
        const configData = await configResponse.json();
        if (configData) {
          const cfg = configData.config || configData;
          config = cfg;
          enabledModels = Array.isArray(cfg.enabledModels) ? cfg.enabledModels : [];

          if (document.getElementById('upstreamUrl')) document.getElementById('upstreamUrl').value = cfg.upstreamBaseURL || 'https://www.codebuff.com';
          if (document.getElementById('rotationInterval')) document.getElementById('rotationInterval').value = cfg.rotationInterval || '6h';

    function renderTokenPools() {
      const container = document.getElementById('tokenPoolsContainer');
      if (!proxyData || !proxyData.token_state || proxyData.token_state.length === 0) {
        container.innerHTML = `
          <div class="text-center py-4">
            <i class="bi bi-key" style="font-size:2rem;color:rgba(255,255,255,0.4)"></i>
            <p class="mt-2 text-muted">No tokens detected</p>
            <button class="btn btn-sm btn-white-bg mt-2" onclick="startOAuth()"><i class="bi bi-shield-lock-fill me-1"></i>Generate Auth Token</button>
          </div>`;
        return;
      }
      const blurClass = blurTokensEnabled ? 'token-blurred' : '';
      container.innerHTML = proxyData.token_state.map(pool => {
        const sessionStatus = pool.session_status || 'none';
        const statusClass = sessionStatus === 'active' ? 'status-online' : 'status-offline';
        const statusText = sessionStatus.charAt(0).toUpperCase() + sessionStatus.slice(1);
        let runsHtml = '';
        if (pool.runs && pool.runs.length > 0) {
          runsHtml = pool.runs.map(run => `<div class="run-item"><span class="run-agent">${run.agent_id}</span><span class="${blurClass}">${run.run_id.substring(0, 8)}... | Inflight: ${run.inflight} | Requests: ${run.request_count}</span></div>`).join('');
        }
        let sessionInfo = '';
        if (pool.session_instance_id) {
          sessionInfo = `<div style="margin-top:8px;font-size:0.8rem;color:#ffffff;" class="${blurClass}">Session: ${pool.session_instance_id.substring(0,12)}...${pool.session_expires_at ? ' | Expires: ' + new Date(pool.session_expires_at).toLocaleTimeString() : ''}</div>`;
        }
        return `<div class="pool-card"><div class="pool-header"><div class="pool-name">${pool.name}</div><div class="pool-status ${statusClass}">${statusText}</div></div>${runsHtml}${sessionInfo}${pool.last_error ? `<div class="text-danger" style="margin-top:8px;font-size:0.8rem;">${pool.last_error}</div>` : ''}</div>`;
      }).join('');
    }

    function getModelDisplayName(model) {
      const meta = modelMetadata[model];
      if (meta) return meta.premium ? `[LIM] ${meta.displayName}` : meta.displayName;
      return model.split('/').pop();

    function renderModels() {
      const container = document.getElementById('modelsContainer');
      document.getElementById('modelCountBadge').textContent = `${enabledModels.length}/${models.length}`;
      if (models.length === 0) { container.innerHTML = '<p class="text-muted">No models available</p>'; return; }
      container.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:3px">${models.map((model, idx) => {
        const isEnabled = enabledModels.includes(model);
        return `<div class="model-tag${isEnabled ? ' enabled' : ''}" onclick="toggleModel(${idx})" id="model-${idx}"><input type="checkbox" class="form-check-input"${isEnabled ? ' checked' : ''}><div><div class="model-tag-name">${escapeHtml(getModelDisplayName(model))}</div><div class="model-tag-id" title="${escapeHtml(model)}">${escapeHtml(model)}</div></div></div>`;
      }).join('')}</div>`;
    }

    function toggleModel(idx) {
      const model = models[idx];
      const tag = document.getElementById(`model-${idx}`);
      const checkbox = tag.querySelector('input[type="checkbox"]');
      const isCurrentlyEnabled = tag.classList.contains('enabled');
      if (isCurrentlyEnabled) {
        tag.classList.remove('enabled');
        checkbox.checked = false;
        enabledModels = enabledModels.filter(m => m !== model);
      } else {
        tag.classList.add('enabled');
        checkbox.checked = true;
        if (!enabledModels.includes(model)) enabledModels.push(model);
      }
      fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabledModels }) });
      document.getElementById('modelCountBadge').textContent = `${enabledModels.length}/${models.length}`;
      showToast(`${getModelDisplayName(model)} ${isCurrentlyEnabled ? 'disabled' : 'enabled'}`, 'info');
    }

    async function startOAuth() {
      const container = document.getElementById('oauthContainer');
      container.style.display = 'block';
      container.innerHTML = '<div class="text-center py-3"><div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">Generating login URL...</p></div>';
      try {
        const response = await fetch('/api/auth/start', { method: 'POST' });
        const data = await response.json();
        if (!data.loginUrl) throw new Error('No login URL received');
        oauthSession = data;
        container.innerHTML = `
          <div class="mb-3">
            <label class="form-label">Step 1: Open Login URL</label>
            <div class="input-group">
              <input type="text" class="form-control" id="oauthLoginUrl" value="${escapeHtml(data.loginUrl)}" readonly>
              <button class="btn btn-outline-action" onclick="copyToClipboard('oauthLoginUrl')">Copy</button>
              <a class="btn btn-white-bg" href="${escapeHtml(data.loginUrl)}" target="_blank">Open</a>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Step 2: Paste Callback URL</label>
            <input type="text" class="form-control" id="oauthCallbackUrl" placeholder="Paste the callback URL after login...">
          </div>
          <button class="btn btn-white-bg w-100" onclick="verifyOAuth()"><i class="bi bi-check-circle me-2"></i>Verify & Fetch Token</button>
          <div id="oauthProgress" style="display:none;margin-top:10px;"><div class="progress"><div class="progress-bar progress-bar-striped progress-bar-animated" style="width:100%"></div></div></div>`;
        startOAuthPolling();
      } catch (error) {
        container.innerHTML = `<div class="text-center text-danger py-3"><i class="bi bi-exclamation-triangle" style="font-size:2rem"></i><p class="mt-2">${error.message}</p><button class="btn btn-sm btn-outline-action" onclick="startOAuth()">Try Again</button></div>`;
      }
    }

    function startOAuthPolling() {
      if (oauthPollTimer) clearInterval(oauthPollTimer);
      let attempts = 0;
      oauthPollTimer = setInterval(async () => {
        attempts++;
        if (attempts > 60) { clearInterval(oauthPollTimer); document.getElementById('oauthProgress').style.display = 'none'; showToast('OAuth timeout', 'warning'); return; }
        try {
          const response = await fetch('/api/auth/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fingerprintId: oauthSession.fingerprintId, fingerprintHash: oauthSession.fingerprintHash, expiresAt: oauthSession.expiresAt }) });
          const data = await response.json();
          if (data.user && data.user.authToken) {
            clearInterval(oauthPollTimer);
            const container = document.getElementById('oauthContainer');
            container.innerHTML = `<div class="text-center py-3"><div class="badge bg-success mb-3"><i class="bi bi-check-circle me-1"></i>Authenticated</div><p class="text-muted">Token added!</p><p class="fw-medium">${escapeHtml(data.user.email || data.user.name)}</p><button class="btn btn-sm btn-outline-action mt-2" onclick="startOAuth()">Generate Another</button></div>`;
            showToast('Auth token added successfully', 'success');
            loadConfiguration();
          }
        } catch (e) {}
      }, 2000);
    }

    async function verifyOAuth() {
      const callbackUrl = document.getElementById('oauthCallbackUrl').value.trim();
      if (!callbackUrl) { showToast('Please paste the callback URL', 'warning'); return; }
      document.getElementById('oauthProgress').style.display = 'block';
      try {
        const authCode = callbackUrl.includes('auth_code=') ? callbackUrl.split('auth_code=')[1].split('&')[0] : callbackUrl;
        const response = await fetch('/api/auth/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fingerprintId: oauthSession.fingerprintId, fingerprintHash: oauthSession.fingerprintHash, expiresAt: oauthSession.expiresAt, authCode }) });
        const data = await response.json();
        if (data.user && data.user.authToken) {
          clearInterval(oauthPollTimer);
          document.getElementById('oauthContainer').innerHTML = `<div class="text-center py-3"><div class="badge bg-success mb-3"><i class="bi bi-check-circle me-1"></i>Authenticated</div><p class="text-muted">Token added!</p><p class="fw-medium">${escapeHtml(data.user.email || data.user.name)}</p><button class="btn btn-sm btn-outline-action mt-2" onclick="startOAuth()">Generate Another</button></div>`;
          showToast('Auth token added successfully', 'success');
          loadConfiguration();
        } else {
          showToast('Verification pending - waiting for login...', 'info');
        }
      } catch (error) {
        document.getElementById('oauthProgress').style.display = 'none';
        showToast('Verification failed: ' + error.message, 'danger');
      }
    }

    function updateRemainingDisplay() {
      const el = document.getElementById('tokenRemainingTime');
      if (!remainingMsAtFetch || !remainingMsTimestamp) { el.textContent = ''; return; }
      const elapsed = Date.now() - remainingMsTimestamp;
      const left = Math.max(0, remainingMsAtFetch - elapsed);
      if (left <= 0) { el.textContent = 'expired'; return; }
      const totalSec = Math.floor(left / 1000);
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      el.textContent = (hrs > 0 ? hrs + 'h ' : '') + mins + 'm ' + secs + 's left';
    }

    function updateStats() {
      if (!proxyData || !proxyData.token_state) return;
      document.getElementById('totalModels').textContent = models.length;
      document.getElementById('startedAt').textContent = new Date(proxyData.started_at).toLocaleString();
      document.getElementById('tokenCountBadge').textContent = proxyData.token_state.length;
      if (!countryCodeSet) {
        const bestToken = proxyData.token_state.find(t => t.country_code) || proxyData.token_state[0];
        const cc = bestToken?.country_code || '-';
        const tier = bestToken?.access_tier || '';
        const el = document.getElementById('countryCode');
        el.textContent = cc;
        if (proxyData.opera_proxy && proxyData.opera_proxy.exit_country) {
          const small = document.createElement('small');
          small.textContent = '>' + proxyData.opera_proxy.exit_country;
          small.style.marginLeft = '4px';
          small.style.opacity = '0.7';
          el.appendChild(small);
        } else if (tier === 'limited') {
          const small = document.createElement('small');
          small.textContent = '(limit)';
          small.style.marginLeft = '4px';
          small.style.opacity = '0.7';
          el.appendChild(small);
        }
        if (cc !== '-') countryCodeSet = true;
      }
      const activeToken = proxyData.token_state.find(t => t.remaining_ms && t.remaining_ms > 0);
      if (activeToken) {
        remainingMsAtFetch = activeToken.remaining_ms;
        remainingMsTimestamp = Date.now();
      } else {
        remainingMsAtFetch = 0;
        remainingMsTimestamp = 0;
      }
      updateRemainingDisplay();
      updateRemainingDisplay();
      if (proxyData.runtime) {
        document.getElementById('runtimeInfo').textContent = proxyData.runtime + ' v' + proxyData.runtime_version;
      }
      if (proxyData.opera_proxy) {
        const el = document.getElementById('operaProxyStatus');
        if (!proxyData.opera_proxy.enabled) {
          el.textContent = 'Disabled';
          el.style.color = '#888';
        } else if (proxyData.opera_proxy.running) {
          el.textContent = 'Running';
          el.style.color = '#4caf50';
        } else {
          el.textContent = 'Ready';
          el.style.color = '#ff9800';
        }
      }
    }

    function toggleSection(name) {
      const body = document.getElementById('section-' + name);
      const card = body.closest('[data-section]');
      const icon = card.querySelector('.toggle-icon');
      body.classList.toggle('collapsed');
      icon.classList.toggle('collapsed');
      setTimeout(() => initLiquidGlass(), 50);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', () => {
      initLiquidGlass();
      try { const cached = localStorage.getItem('adsEnabled'); if (cached === 'false') { adsEnabled = false; const t = document.getElementById('adsToggleEnv'); if (t) t.checked = false; } } catch (e) {}
      loadConfiguration().then(() => { fetchBingWallpaper(); if (adsEnabled) fetchAds().then(() => { renderAdInTokenCard(); setTimeout(() => initLiquidGlass(), 100); }); else { renderAdInTokenCard(); setTimeout(() => initLiquidGlass(), 100); } });
      checkHealth();
      setInterval(() => checkHealth(true), 5000);
      setInterval(() => rotateAd(), 30000);
      setInterval(() => updateRemainingDisplay(), 1000);
    });
  </script>
</body>
</html>
